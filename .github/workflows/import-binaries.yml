name: Import binaries

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-binaries.yml

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download IPA and ZIP files
        run: |
          set -euo pipefail
          mkdir -p ipa zip
          fetch() {
            echo "GET $1"
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" -o "$1" "$2"
            ls -lh "$1"
          }
          fetch ipa/Vel0raBreak.ipa "https://tmpfiles.org/dl/1789333815.77f316e36e065bc8/wYwKPB260WiU/vel0rabreak.ipa"
          fetch ipa/NekoJB-Fixed.ipa "https://tmpfiles.org/dl/1789333822.ea533d2b3a8dec47/wCwfPY2l0sI3/nekojb-fixed.ipa"
          fetch ipa/nekoJB_2.0.11.ipa "https://tmpfiles.org/dl/1789333828.98fe0ae65e3e1668/wCw9PZ2s0MBJ/nekojb_2.0.11.ipa"
          fetch ipa/nekoJB-signed.ipa "https://tmpfiles.org/dl/1789333836.27e3a2ac6f1e2312/whwlPD2L0f4I/nekojb-signed.ipa"
          fetch zip/Velora-theos.zip "https://tmpfiles.org/dl/1789333837.2a91d311e79a21f8/wpwEPQ2s0Ymm/velora-theos.zip"
          fetch zip/overlay.zip "https://tmpfiles.org/dl/1789333837.2016d912613aa1df/whw6PN2w0TPi/overlay.zip"
          fetch zip/NekoJB-Fixed-IPA.zip "https://tmpfiles.org/dl/1789333838.d36d6076162afb1f/wAwIP1290HqS/nekojb-fixed-ipa.zip"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add ipa zip
          git status
          git commit -m "Add IPA and ZIP library files" || echo "no changes"
          git push
