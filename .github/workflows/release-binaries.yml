name: release-binaries

on:
  workflow_dispatch:
  push:
    paths:
      - ipa/**
      - zip/**
      - .github/workflows/release-binaries.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish IPA and ZIP as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: files
          name: Vlib files
          make_latest: true
          files: |
            ipa/*.ipa
            zip/*.zip
          fail_on_unmatched_files: true
